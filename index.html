<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【WING】- to MP3 - Ver1.0</title>
  <!-- ブラウザ上でMP3エンコードを行うためのライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    :root {
      --bg-dark: #070913;
      --bg-gradient: radial-gradient(circle at 50% 0%, #1a103c 0%, #090c1a 55%, #05060d 100%);
      --card-bg: rgba(16, 22, 46, 0.78);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-purple: #b026ff;
      --neon-green: #00ff9d;
      --neon-yellow: #ffe600;
      --text-main: #f4f7ff;
      --text-sub: #9aa7cc;
      --border-glow: rgba(0, 243, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 127, 0.04) 1px, transparent 1px),
        var(--bg-gradient);
      background-size: 28px 28px, 28px 28px, 100% 100%;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 18px 16px 28px;
    }

    /* ヘッダー（タイトル表示） */
    header {
      text-align: center;
      padding: 14px 10px 22px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.25);
      margin-bottom: 20px;
      box-shadow: 0 6px 24px -12px rgba(0, 243, 255, 0.45);
    }

    .cyber-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--neon-green);
      background: rgba(0, 255, 157, 0.1);
      border: 1px solid rgba(0, 255, 157, 0.45);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
      text-shadow: 0 0 8px rgba(0, 255, 157, 0.6);
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.35));
      line-height: 1.3;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 8px;
      font-weight: 600;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
    }

    /* 大型ファイル選択エリア */
    .upload-box {
      background: var(--card-bg);
      border: 2px dashed var(--neon-cyan);
      border-radius: 20px;
      padding: 34px 20px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, background-color 0.2s;
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.18), inset 0 0 18px rgba(176, 38, 255, 0.12);
    }

    .upload-box.dragover,
    .upload-box:active {
      transform: scale(0.98);
      background-color: rgba(0, 243, 255, 0.1);
      box-shadow: 0 0 28px rgba(0, 243, 255, 0.45);
    }

    .upload-icon {
      font-size: 2.8rem;
      margin-bottom: 10px;
      display: block;
      filter: drop-shadow(0 0 10px rgba(255, 0, 127, 0.7));
    }

    .upload-text {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.45);
    }

    .upload-subtext {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 8px;
      line-height: 1.5;
    }

    input[type="file"] {
      display: none;
    }

    /* 選択ファイル表示 */
    .file-info {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px 18px;
      display: none;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 0, 127, 0.5);
      box-shadow: 0 0 16px rgba(255, 0, 127, 0.2);
    }

    .file-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      word-break: break-all;
      padding-right: 12px;
    }

    .file-size {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--neon-pink);
      white-space: nowrap;
    }

    /* ビットレート選択（大きめボタン） */
    .setting-box {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid var(--border-glow);
    }

    .setting-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--neon-cyan);
      margin-bottom: 12px;
      display: block;
      letter-spacing: 0.04em;
    }

    .bitrate-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .bitrate-btn {
      min-height: 54px;
      padding: 10px 6px;
      background: rgba(10, 15, 34, 0.9);
      color: var(--text-main);
      border: 1.5px solid rgba(154, 167, 204, 0.35);
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .bitrate-btn:active {
      transform: scale(0.96);
    }

    .bitrate-btn.active {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.25), rgba(176, 38, 255, 0.28));
      border-color: var(--neon-cyan);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(0, 243, 255, 0.45);
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.8);
    }

    /* 大型 変換実行ボタン */
    .action-btn {
      width: 100%;
      min-height: 68px;
      padding: 20px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(90deg, var(--neon-cyan) 0%, var(--neon-purple) 55%, var(--neon-pink) 100%);
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      cursor: pointer;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
      box-shadow: 0 0 24px rgba(255, 0, 127, 0.4), 0 0 18px rgba(0, 243, 255, 0.35);
      transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
    }

    .action-btn:disabled {
      background: linear-gradient(90deg, #252b42, #1e2236);
      color: #6f7899;
      text-shadow: none;
      box-shadow: none;
      cursor: not-allowed;
    }

    .action-btn:not(:disabled):active {
      transform: scale(0.97);
      box-shadow: 0 0 34px rgba(0, 243, 255, 0.7);
    }

    /* 進行状況 */
    .status-box {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      display: none;
      flex-direction: column;
      gap: 12px;
      border: 1px solid rgba(0, 255, 157, 0.4);
      box-shadow: 0 0 18px rgba(0, 255, 157, 0.15);
    }

    .status-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--neon-green);
      text-align: center;
      text-shadow: 0 0 8px rgba(0, 255, 157, 0.4);
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background-color: rgba(8, 12, 26, 0.95);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(0, 243, 255, 0.25);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan), var(--neon-pink));
      box-shadow: 0 0 12px var(--neon-cyan);
      transition: width 0.2s ease;
    }

    /* 大型 ダウンロードボタン */
    .download-btn {
      display: none;
      width: 100%;
      min-height: 70px;
      padding: 20px;
      border-radius: 18px;
      background: linear-gradient(90deg, var(--neon-green), #00d4ff);
      color: #050814;
      text-align: center;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      box-shadow: 0 0 28px rgba(0, 255, 157, 0.55);
      transition: transform 0.12s;
    }

    .download-btn:active {
      transform: scale(0.97);
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-sub);
      padding-top: 24px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <header>
    <div class="cyber-badge">44.1kHz // STEREO // MP3</div>
    <h1>【WING】- to MP3 - Ver1.0</h1>
    <p>44.1kHz / ステレオ MP3へ統一変換</p>
  </header>

  <div class="container">
    <!-- 大型ファイル選択エリア -->
    <label class="upload-box" id="uploadBox" for="fileInput">
      <span class="upload-icon">⚡</span>
      <div class="upload-text">ファイルを選択する</div>
      <div class="upload-subtext">MP3 / MP4 / MOV / WAV / M4A / AAC / FLAC / OGG<br>常時 44.1kHz / ステレオ MP3 に変換</div>
      <input type="file" id="fileInput" accept=".mp3,audio/mpeg,audio/*,video/*,.mp4,.mov,.m4a,.wav,.flac,.ogg,.aac,.wma">
    </label>

    <!-- 選択されたファイル情報 -->
    <div class="file-info" id="fileInfo">
      <div class="file-name" id="fileName">sample.mp3</div>
      <div class="file-size" id="fileSize">0 MB</div>
    </div>

    <!-- ビットレート設定 -->
    <div class="setting-box">
      <span class="setting-label">OUTPUT BITRATE（出力音質 / 44.1kHz Stereo）</span>
      <div class="bitrate-group" id="bitrateGroup">
        <button type="button" class="bitrate-btn" data-bitrate="128">128k</button>
        <button type="button" class="bitrate-btn active" data-bitrate="192">192k<br><span style="font-size:0.7rem;">STD</span></button>
        <button type="button" class="bitrate-btn" data-bitrate="320">320k<br><span style="font-size:0.7rem;">HIGH</span></button>
      </div>
    </div>

    <!-- 大型変換ボタン -->
    <button type="button" class="action-btn" id="convertBtn" disabled>MP3に変換する</button>

    <!-- ステータス表示 -->
    <div class="status-box" id="statusBox">
      <div class="status-text" id="statusText">STANDBY...</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- 大型 ダウンロードボタン -->
    <a class="download-btn" id="downloadBtn" href="#" download="output.mp3">MP3をダウンロードする</a>
  </div>

  <footer>【WING】- to MP3 - Ver1.0 // 44.1kHz STEREO ENGINE</footer>

  <script>
    const uploadBox = document.getElementById('uploadBox');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileNameEl = document.getElementById('fileName');
    const fileSizeEl = document.getElementById('fileSize');
    const bitrateButtons = document.querySelectorAll('.bitrate-btn');
    const convertBtn = document.getElementById('convertBtn');
    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const downloadBtn = document.getElementById('downloadBtn');

    let selectedFile = null;
    let selectedBitrate = 192;
    let currentObjectUrl = null;

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function floatTo16BitPCM(float32Array) {
      const int16Array = new Int16Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return int16Array;
    }

    function updateStatus(text, percent) {
      statusBox.style.display = 'flex';
      statusText.textContent = text;
      progressBar.style.width = `${Math.max(0, Math.min(100, percent))}%`;
    }

    function isMp3File(file) {
      if (!file) return false;
      const lowerName = file.name.toLowerCase();
      return lowerName.endsWith('.mp3') || file.type === 'audio/mpeg' || file.type === 'audio/mp3';
    }

    function buildOutputFileName(originalName) {
      const baseName = originalName.replace(/\.[^/.]+$/, '') || 'converted';
      if (isMp3File(selectedFile)) {
        return `${baseName}_44100_stereo_${selectedBitrate}k.mp3`;
      }
      return `${baseName}.mp3`;
    }

    // 任意チャンネル・任意サンプルレートのAudioBufferを 44100Hz / 2ch ステレオに変換
    async function renderTo44100Stereo(decodedBuffer) {
      const targetSampleRate = 44100;
      const targetChannels = 2;
      const frameCount = Math.ceil(decodedBuffer.duration * targetSampleRate);
      const offlineCtx = new OfflineAudioContext(targetChannels, frameCount, targetSampleRate);

      // 入力が1ch（モノラル）の場合も2chに複製してステレオ化
      let sourceBuffer = decodedBuffer;
      if (decodedBuffer.numberOfChannels === 1) {
        const stereoInput = offlineCtx.createBuffer(2, decodedBuffer.length, decodedBuffer.sampleRate);
        const monoData = decodedBuffer.getChannelData(0);
        stereoInput.copyToChannel(monoData, 0);
        stereoInput.copyToChannel(monoData, 1);
        sourceBuffer = stereoInput;
      }

      const source = offlineCtx.createBufferSource();
      source.buffer = sourceBuffer;
      source.connect(offlineCtx.destination);
      source.start(0);
      return await offlineCtx.startRendering();
    }

    function handleFileSelect(file) {
      if (!file) return;
      selectedFile = file;
      fileNameEl.textContent = file.name;
      fileSizeEl.textContent = formatFileSize(file.size);
      fileInfo.style.display = 'flex';
      convertBtn.disabled = false;

      downloadBtn.style.display = 'none';
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      statusBox.style.display = 'none';
      progressBar.style.width = '0%';
    }

    fileInput.addEventListener('change', (e) => {
      handleFileSelect(e.target.files[0]);
    });

    ['dragenter', 'dragover'].forEach((eventName) => {
      uploadBox.addEventListener(eventName, (e) => {
        e.preventDefault();
        uploadBox.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      uploadBox.addEventListener(eventName, (e) => {
        e.preventDefault();
        uploadBox.classList.remove('dragover');
      });
    });

    uploadBox.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file) {
        fileInput.files = e.dataTransfer.files;
        handleFileSelect(file);
      }
    });

    bitrateButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        bitrateButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        selectedBitrate = parseInt(btn.dataset.bitrate, 10) || 192;
      });
    });

    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      if (typeof lamejs === 'undefined' || !lamejs.Mp3Encoder) {
        updateStatus('ERROR: MP3エンコーダを読み込めませんでした。ネットワーク接続を確認してください。', 0);
        return;
      }

      convertBtn.disabled = true;
      downloadBtn.style.display = 'none';
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContextClass();

      try {
        updateStatus('音声データを読み込み中...', 12);
        const arrayBuffer = await selectedFile.arrayBuffer();

        updateStatus('音声トラックをデコード中...', 28);
        const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        updateStatus('44100Hz / ステレオに変換中...', 45);
        const stereoBuffer = await renderTo44100Stereo(decodedBuffer);

        updateStatus(`MP3エンコード中 (44100Hz / Stereo / ${selectedBitrate}kbps)...`, 58);

        const targetSampleRate = 44100;
        const channels = 2;
        const leftSamples = floatTo16BitPCM(stereoBuffer.getChannelData(0));
        const rightSamples = floatTo16BitPCM(stereoBuffer.getChannelData(1));

        const encoder = new lamejs.Mp3Encoder(channels, targetSampleRate, selectedBitrate);
        const mp3Data = [];
        const blockSize = 1152;
        const totalSamples = leftSamples.length;

        for (let i = 0; i < totalSamples; i += blockSize) {
          const leftChunk = leftSamples.subarray(i, i + blockSize);
          const rightChunk = rightSamples.subarray(i, i + blockSize);
          const mp3buf = encoder.encodeBuffer(leftChunk, rightChunk);

          if (mp3buf.length > 0) {
            mp3Data.push(new Uint8Array(mp3buf));
          }

          if (i % (blockSize * 40) === 0) {
            const encodeProgress = 58 + Math.floor((i / totalSamples) * 38);
            updateStatus(`MP3エンコード中... ${encodeProgress}%`, encodeProgress);
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
        }

        const flushBuf = encoder.flush();
        if (flushBuf.length > 0) {
          mp3Data.push(new Uint8Array(flushBuf));
        }

        const mp3Blob = new Blob(mp3Data, { type: 'audio/mpeg' });
        currentObjectUrl = URL.createObjectURL(mp3Blob);

        const outputName = buildOutputFileName(selectedFile.name);
        downloadBtn.href = currentObjectUrl;
        downloadBtn.download = outputName;
        downloadBtn.textContent = `MP3をダウンロード（${formatFileSize(mp3Blob.size)}）`;
        downloadBtn.style.display = 'block';

        updateStatus(`変換完了（44100Hz / Stereo / ${outputName}）`, 100);
      } catch (err) {
        console.error(err);
        updateStatus('変換に失敗しました。非対応の音声コーデックまたは破損ファイルの可能性があります。', 0);
      } finally {
        convertBtn.disabled = false;
        if (audioCtx.state !== 'closed') {
          await audioCtx.close().catch(() => {});
        }
      }
    });
  </script>
</body>
</html>
